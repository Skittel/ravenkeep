<VirtualHost *:80>
    ServerName app.ravenkeep.cloud
    ServerAlias eu01.ravenkeep.cloud ravenkeep.cloud
    # Port 80 is public only for Let's Encrypt; everything else redirects to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
<VirtualHost *:443>
    ServerName app.ravenkeep.cloud
    ServerAlias eu01.ravenkeep.cloud ravenkeep.cloud
    DocumentRoot /srv/ravenkeep/webapp/public
    <Directory /srv/ravenkeep/webapp/public>
        AllowOverride All
        Require all granted
    </Directory>
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/eu01.ravenkeep.cloud/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/eu01.ravenkeep.cloud/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog ${APACHE_LOG_DIR}/ravenkeep-error.log
    CustomLog ${APACHE_LOG_DIR}/ravenkeep-access.log combined
</VirtualHost>
