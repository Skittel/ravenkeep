<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">Ravenkeep – Rabe und Burg</title>
  <desc id="desc">Neu gezeichnetes Vektorlogo: ein schwarzer Rabe links mit rot leuchtendem Auge, rechts eine mittelalterliche schwarze Burg, darunter Ravenkeep.</desc>
  <!-- Alle Illustrationselemente sind eigens gezeichnete SVG-Vektorformen.
       Keine eingebetteten PNG/JPEG-Dateien, keine Raster-Vektorisierung. -->
  <defs>
    <radialGradient id="paper" cx="52%" cy="44%" r="77%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.77" stop-color="#f9f9f9"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#424448"/>
      <stop offset="0.45" stop-color="#292b2e"/>
      <stop offset="1" stop-color="#17181a"/>
    </linearGradient>
    <linearGradient id="redEye" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ff282f"/>
      <stop offset="0.55" stop-color="#ff3035"/>
      <stop offset="1" stop-color="#d81924"/>
    </linearGradient>
    <!-- Keep the eye glow localized. Feather and head remain fully opaque. -->
    <filter id="eyeGlow" x="-85%" y="-85%" width="270%" height="270%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <path id="background" fill="url(#paper)" d="M0 0H1254V1254H0Z"/>

  <!-- CASTLE / KEEP: a clean geometric fortress, independently editable. -->
  <g id="keep" fill="#17181a">
    <!-- Left outer wall and battlements -->
    <path id="left-wall" d="M509 809 L512 708 L565 693 L565 725 L601 714 L601 680
      L645 667 L645 701 L680 691 L680 657 L726 642 L722 809 Z"/>
    <!-- Right outer wall and battlements -->
    <path id="right-wall" d="M961 813 L980 649 L1017 664 L1017 697 L1047 706 L1047 670
      L1078 682 L1078 709 L1105 720 L1105 690 L1142 701 L1142 877
      Q1057 840 961 835 Z"/>
    <!-- Four individually modeled crenellations, as in the reference. -->
    <path id="battlement-1" d="M719 507 L758 494 L758 542 L716 556 Z"/>
    <path id="battlement-2" d="M794 482 L837 468 L837 511 L793 524 Z"/>
    <path id="battlement-3" d="M876 468 L918 480 L918 519 L876 508 Z"/>
    <path id="battlement-4" d="M951 486 L994 499 L997 575 L979 567 L979 534 L951 524 Z"/>
    <!-- Roofline, tower, and two deliberately hollow Gothic windows. -->
    <path id="tower" fill-rule="evenodd" d="
      M714 581 L856 538 L996 574 L965 606 L966 816
      Q930 829 892 833 L818 832 L741 807 L744 607 Z
      M835 654 L874 654 L874 614 Q874 599 855 586 Q835 599 835 615 Z
      M817 841 L892 841 L892 757 Q892 724 855 701 Q817 721 817 758 Z"/>
    <!-- Clear, wide light seams on both sides of the main tower. -->
    <path id="tower-seam-left" fill="#fafafa" d="M720 802 L743 804 L743 604 L728 594 Z"/>
    <path id="tower-seam-right" fill="#fafafa" d="M964 606 L965 811 L986 816 L979 597 Z"/>
    <!-- Rampart below the raven and the keep: slightly curved like the reference. -->
    <path id="footing" d="M278 896 Q416 849 568 838 Q716 822 870 833
      Q1030 840 1155 892 Q997 858 851 838 Q619 817 444 861 Q347 879 278 896 Z"/>
  </g>

