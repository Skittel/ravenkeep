      Q544 444 549 429 Z"/>
    <!-- Localized red eye and optional blur behind it. -->
    <path id="eye-light" fill="#f21f29" opacity=".65" filter="url(#eyeGlow)"
      d="M500 310 Q531 327 565 337 Q547 355 526 350 Q505 344 500 310 Z"/>
    <path id="eye" fill="url(#redEye)" d="M500 310
      C517 318 543 330 565 338
      C550 350 539 353 527 349
      C510 343 500 328 500 310 Z"/>
  </g>

