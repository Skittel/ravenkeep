    <path id="raven-beak" fill="url(#beak)" d="
      M594 345 Q619 338 647 330
      C700 350 756 411 768 474
      C731 441 692 418 654 408
      C614 395 569 386 515 397
      C569 371 615 369 657 379
      C640 365 621 351 594 345 Z"/>
