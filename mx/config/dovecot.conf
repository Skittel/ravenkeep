# Ravenkeep MX node – Dovecot is used ONLY as SASL authentication backend for Postfix.
# No IMAP/POP3, no mailboxes. SMTP identities are maintained by the web app in
# /etc/ravenkeep/smtp-users (passwd-file format: user:{SCHEME}hash).
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols =
auth_mechanisms = plain login
auth_username_format = %{user | lower}

passdb passwd-file {
  passwd_file_path = /etc/ravenkeep/smtp-users
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
log_path = syslog
