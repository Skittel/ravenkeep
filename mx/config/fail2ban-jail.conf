[DEFAULT]
# Admin networks are never banned; deploy.sh appends the entries of /etc/ravenkeep/admin-networks (server-local, not in git)
ignoreip = 127.0.0.1/8 ::1
banaction = ufw

[sshd]
enabled = true

[postfix-sasl]
enabled  = true
backend  = auto
logpath  = /var/log/mail.log
port     = smtp,submission,submissions
maxretry = 5
findtime = 10m
bantime  = 1h
